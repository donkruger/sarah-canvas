<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo title — Sarah Mason</title>
    <meta name="description" content="Photo share." />
    <link rel="stylesheet" href="/canvas.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/">Sarah Mason</a>
        <span class="pill">Photo</span>
      </div>
    </header>

    <main class="wrap">
      <p class="meta">YYYY-MM-DD</p>
      <h1>Photo title</h1>
      <p class="lede">Optional context above the image.</p>

      <!-- Put image files next to this index.html, e.g. photo.jpg -->
      <figure class="photo-figure">
        <img src="photo.jpg" alt="Describe the image" />
        <figcaption>Caption for the photo.</figcaption>
      </figure>

      <!-- Or several: -->
      <!--
      <div class="photo-grid">
        <figure class="photo-figure">
          <img src="a.jpg" alt="…" />
          <figcaption>A</figcaption>
        </figure>
        <figure class="photo-figure">
          <img src="b.jpg" alt="…" />
          <figcaption>B</figcaption>
        </figure>
      </div>
      -->
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p><a href="/">← Canvas home</a></p>
      </div>
    </footer>
  </body>
</html>
