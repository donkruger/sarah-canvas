# Sarah Mason Canvas — static publish, zero build.
# Push to main → Netlify deploys site/ → agent-sarah-mason-canvas.netlify.app

[build]
  publish = "site"
  command = "echo 'static — no build'"

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Cache: shared CSS / assets ───────────────────────────────────────────────
[[headers]]
  for = "/canvas.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── HTML (shares update often) ───────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/shares/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

# ── SPA-style clean URLs for shares (trailing slash → index.html) ────────────
[[redirects]]
  from = "/shares/*"
  to = "/shares/:splat/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
